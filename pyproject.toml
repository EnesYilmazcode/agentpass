[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpass"
version = "0.1.0"
description = "A passport for AI agents on the open web."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "mcp>=1.0",
  "patchright>=1.50",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
agentpass = "agentpass.mcp:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "live: requires a locally installed Chrome browser and network access",
]

[tool.hatch.build.targets.wheel]
packages = ["agentpass"]

